# fly.toml app configuration file generated for heyokay on 2026-11-17T22:02:16Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'heyokay'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/heyokay.db'
  NODE_ENV = 'production'
  NWS_AREAS = 'CA'
  PORT = '8787'

[[mounts]]
  source = 'heyokay_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
