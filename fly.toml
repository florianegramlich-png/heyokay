# Fly.io config for the Hey-Okay API server (the Dockerfile next to this builds server/).
# First deploy: see "Deploy" in the README.
# `app` must be unique on Fly; `fly launch --no-deploy` can rename it for you.
app = "heyokay-api"
primary_region = "fra" # Frankfurt (PRD 10.4: EU hosting)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DB_PATH = "/data/heyokay.db"
  # US test mode: National Weather Service alerts for California. Remove for a Germany-only server.
  NWS_AREAS = "CA"
  # Secrets are set with `fly secrets set`, never here:
  #   ADMIN_TOKEN (required), NWS_USER_AGENT and GEOCODER_USER_AGENT (a contact, e.g. "HeyOkay (you@…)"),
  #   ANTHROPIC_API_KEY (optional; without it alerts use rules + templates).

# SQLite needs one machine with a persistent disk. Postgres (roadmap) lifts this.
[mounts]
  source = "heyokay_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # The server polls warning sources every 2 minutes, so it must never be stopped for idling.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
