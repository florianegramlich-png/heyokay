# Local Postgres (PostGIS + pgvector) for development and the Postgres test run.
#   docker compose up -d
#   DATABASE_URL=postgres://heyokay:heyokay@localhost:5432/heyokay npm run dev
#   TEST_DATABASE_URL=postgres://heyokay:heyokay@localhost:5432/heyokay_test npm test
# Local use only: the password is not a secret, and the port is bound to localhost.
services:
  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: heyokay
      POSTGRES_PASSWORD: heyokay
      POSTGRES_DB: heyokay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heyokay -d heyokay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
