name: Deploy server to staging

# Every push to the build agent's branch (agent/next) that touches the server deploys it to the
# staging app (fly.staging.toml), so a PR can be tried on a real server before it reaches main.
# Skips (instead of failing) until the FLY_STAGING_API_TOKEN repository secret exists.
on:
  push:
    branches: [agent/next]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'fly.staging.toml'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true # a newer push replaces an older staging deploy

jobs:
  deploy:
    name: Test and deploy to staging
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the staging token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_STAGING_API_TOKEN is not set, so staging was not deployed. See docs/runbooks/staging.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci && npm test && npm run typecheck
        if: steps.token.outputs.present == 'true'
        working-directory: server
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - run: flyctl deploy --remote-only --config fly.staging.toml
        if: steps.token.outputs.present == 'true'
