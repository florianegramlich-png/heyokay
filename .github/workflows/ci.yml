name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The store contract and end-to-end tests also run against Postgres (with PostGIS and pgvector).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: heyokay
          POSTGRES_PASSWORD: heyokay
          POSTGRES_DB: heyokay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heyokay -d heyokay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://heyokay:heyokay@localhost:5432/heyokay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The PostGIS image has no pgvector; add it the same way server/docker/postgres/Dockerfile does.
      - name: Add pgvector to the Postgres service
        run: docker exec ${{ job.services.postgres.id }} sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-pgvector'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  app:
    name: App typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
